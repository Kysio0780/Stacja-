name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalacja zależności
        run: npm install --no-audit --no-fund

      - name: Przygotowanie katalogu www
        run: npm run prepare:web

      - name: Dodanie platformy Android (jeśli nie istnieje)
        run: |
          if [ ! -f android/build.gradle ]; then
            npx cap add android
          fi

      - name: Konfiguracja Firebase (google-services.json)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p android/app
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "Użyto google-services.json z sekretu repozytorium."
          else
            cp google-services.placeholder.json android/app/google-services.json
            echo "UWAGA: brak sekretu GOOGLE_SERVICES_JSON — push notifications NIE BĘDĄ działać."
          fi

      - name: Natywna ikona i ekran startowy
        run: npx @capacitor/assets generate --android --assetPath assets --iconBackgroundColor '#2563eb' --splashBackgroundColor '#2563eb'

      - name: Synchronizacja Capacitor
        run: npx cap sync android

      - name: Przygotowanie podpisu release
        if: env.HAS_SIGNING == 'true'
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          {
            echo "SIGNING_STORE_PASSWORD=$SIGNING_STORE_PASSWORD"
            echo "SIGNING_KEY_PASSWORD=$SIGNING_KEY_PASSWORD"
            echo "SIGNING_KEY_ALIAS=$SIGNING_KEY_ALIAS"
          } >> android/gradle.properties
          node scripts/configure-signing.js

      - name: Budowa APK (release, podpisany)
        if: env.HAS_SIGNING == 'true'
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleRelease

      - name: Budowa APK (debug, bez podpisu release)
        if: env.HAS_SIGNING != 'true'
        run: |
          echo "UWAGA: brak sekretów podpisu — buduję APK debug (klucz zmienia się przy każdym buildzie)."
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug

      - name: Upload artefaktu (release)
        if: env.HAS_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sklep-app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload artefaktu (debug)
        if: env.HAS_SIGNING != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sklep-app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
