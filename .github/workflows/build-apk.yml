name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

# Nie pozwalamy na równoległe budowy tego samego APK — to właśnie wywołuje 429 z Maven Central.
concurrency:
  group: apk-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalacja zależności
        run: npm install --no-audit --no-fund

      - name: Przygotowanie katalogu www
        run: npm run prepare:web

      - name: Dodanie platformy Android (jeśli nie istnieje)
        run: |
          if [ ! -f android/build.gradle ]; then
            npx cap add android
          fi

      - name: Cache zależności Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Konfiguracja Firebase (google-services.json)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p android/app
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "Użyto google-services.json z sekretu repozytorium."
          else
            cp google-services.placeholder.json android/app/google-services.json
            echo "UWAGA: brak sekretu GOOGLE_SERVICES_JSON — push notifications NIE BĘDĄ działać."
          fi

      - name: Natywna ikona i ekran startowy
        run: npx @capacitor/assets generate --android --assetPath assets --iconBackgroundColor '#2563eb' --splashBackgroundColor '#2563eb'

      - name: Synchronizacja Capacitor
        run: npx cap sync android

      - name: Nazwa aplikacji przy ikonie
        run: sed -i 's|<string name="app_name">.*</string>|<string name="app_name">SP580app</string>|' android/app/src/main/res/values/strings.xml

      - name: Przygotowanie podpisu release
        if: env.HAS_SIGNING == 'true'
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          clean() { printf '%s' "$1" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          STORE_PASS=$(clean "$SIGNING_STORE_PASSWORD")
          KEY_PASS=$(clean "$SIGNING_KEY_PASSWORD")
          KEY_ALIAS=$(clean "$SIGNING_KEY_ALIAS")
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > android/app/release.keystore
          {
            echo "SIGNING_STORE_PASSWORD=$STORE_PASS"
            echo "SIGNING_KEY_PASSWORD=$KEY_PASS"
            echo "SIGNING_KEY_ALIAS=$KEY_ALIAS"
          } >> android/gradle.properties
          node scripts/configure-signing.js

      - name: Sprawdzenie klucza podpisu
        if: env.HAS_SIGNING == 'true'
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          clean() { printf '%s' "$1" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          STORE_PASS=$(clean "$SIGNING_STORE_PASSWORD")
          KEY_PASS=$(clean "$SIGNING_KEY_PASSWORD")
          KEY_ALIAS=$(clean "$SIGNING_KEY_ALIAS")
          if keytool -list -keystore android/app/release.keystore -storetype PKCS12 -storepass "$STORE_PASS" > /dev/null 2>&1; then
            echo "OK: haslo do magazynu kluczy jest poprawne."
          else
            echo "BLAD: haslo SIGNING_STORE_PASSWORD jest niepoprawne."
            exit 1
          fi
          if keytool -exportcert -alias "$KEY_ALIAS" -keystore android/app/release.keystore -storetype PKCS12 -storepass "$STORE_PASS" -keypass "$STORE_PASS" -file /tmp/cert.cer > /dev/null 2>&1; then
            echo "OK: alias i haslo SIGNING_KEY_PASSWORD sa poprawne."
          else
            echo "BLAD: niepoprawny jest SIGNING_KEY_PASSWORD albo SIGNING_KEY_ALIAS (powinien byc: sklepapp)."
            exit 1
          fi

      - name: Budowa APK (release, podpisany)
        if: env.HAS_SIGNING == 'true'
        run: |
          chmod +x android/gradlew
          UDALO_SIE=0
          for proba in 1 2 3; do
            if (cd android && ./gradlew assembleRelease --no-daemon); then UDALO_SIE=1; break; fi
            echo "Próba $proba nieudana (możliwy 429 z Maven Central) — ponawiam za 60 s."
            sleep 60
          done
          [ "$UDALO_SIE" = "1" ] || { echo "Budowa release nie powiodła się po 3 próbach."; exit 1; }

      - name: Budowa APK (debug, bez podpisu release)
        if: env.HAS_SIGNING != 'true'
        run: |
          echo "UWAGA: brak sekretów podpisu — buduję APK debug (klucz zmienia się przy każdym buildzie)."
          chmod +x android/gradlew
          UDALO_SIE=0
          for proba in 1 2 3; do
            if (cd android && ./gradlew assembleDebug --no-daemon); then UDALO_SIE=1; break; fi
            echo "Próba $proba nieudana (możliwy 429 z Maven Central) — ponawiam za 60 s."
            sleep 60
          done
          [ "$UDALO_SIE" = "1" ] || { echo "Budowa debug nie powiodła się po 3 próbach."; exit 1; }

      - name: Upload artefaktu (release)
        if: env.HAS_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sklep-app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload artefaktu (debug)
        if: env.HAS_SIGNING != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sklep-app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
