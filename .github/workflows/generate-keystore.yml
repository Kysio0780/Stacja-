name: Generate Signing Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Wygeneruj klucz podpisu release
        id: key
        run: |
          STORE_PASS=$(openssl rand -base64 24)
          KEY_PASS=$(openssl rand -base64 24)
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias sklepapp \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
            -dname "CN=SklepApp, OU=IT, O=Sklep, L=Warszawa, ST=Mazowieckie, C=PL"
          echo "store_password=$STORE_PASS" >> "$GITHUB_OUTPUT"
          echo "key_password=$KEY_PASS" >> "$GITHUB_OUTPUT"
          echo "keystore_base64=$(base64 -w0 release.keystore)" >> "$GITHUB_OUTPUT"

      - name: Pokaż wartości do zapisania w sekretach
        run: |
          echo "=== SKOPUJ TE 4 WARTOŚCI DO SEKRETÓW REPOZYTORIUM ==="
          echo "SIGNING_KEYSTORE_BASE64:"
          echo "${{ steps.key.outputs.keystore_base64 }}"
          echo "SIGNING_STORE_PASSWORD:"
          echo "${{ steps.key.outputs.store_password }}"
          echo "SIGNING_KEY_PASSWORD:"
          echo "${{ steps.key.outputs.key_password }}"
          echo "SIGNING_KEY_ALIAS:"
          echo "sklepapp"

      - name: Upload pliku keystore (kopia zapasowa)
        uses: actions/upload-artifact@v4
        with:
          name: signing-keystore
          path: release.keystore
          if-no-files-found: error
